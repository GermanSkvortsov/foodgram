name: Foodgram Workflow

on:
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt

    - name: Run flake8
      run: |
        flake8 backend --exclude=venv,migrations

  build_backend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/
        push: false
        tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest
        outputs: type=docker,dest=/tmp/backend_image.tar

    - name: Upload Backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend_image
        path: /tmp/backend_image.tar
        retention-days: 1

  build_frontend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend/
        push: false
        tags: ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest
        outputs: type=docker,dest=/tmp/frontend_image.tar

    - name: Upload Frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend_image
        path: /tmp/frontend_image.tar
        retention-days: 1

  push_images:
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend]
    steps:
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Download Backend artifact
      uses: actions/download-artifact@v4
      with:
        name: backend_image
        path: /tmp

    - name: Load and Push Backend
      run: |
        docker load --input /tmp/backend_image.tar
        docker push ${{ secrets.DOCKER_USERNAME }}/foodgram_backend:latest

    - name: Download Frontend artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend_image
        path: /tmp

    - name: Load and Push Frontend
      run: |
        docker load --input /tmp/frontend_image.tar
        docker push ${{ secrets.DOCKER_USERNAME }}/foodgram_frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: push_images
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy all files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        source: "infra/, backend/, frontend/"
        target: "foodgram"

    - name: Deploy containers
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd foodgram/infra
          sudo docker compose -f docker-compose.production.yml up -d --build
          sudo docker system prune -f

    - name: Run migrations
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        key: ${{ secrets.SSH_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd foodgram/infra
          sudo docker compose -f docker-compose.production.yml exec backend python manage.py migrate